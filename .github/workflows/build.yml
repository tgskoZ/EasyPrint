name: Build Geode Mod

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a tag + GitHub release with this name (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: v5.10.1

      - uses: actions/upload-artifact@v4
        with:
          name: EasyPrint
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: EasyPrint
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: EasyPrint ${{ inputs.release_tag || github.ref_name }}
          body_path: changelog.md
          files: dist/*.geode
